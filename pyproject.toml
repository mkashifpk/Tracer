[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tracer"
version = "0.1.0"
description = "Tracer - Turn bitmap images into SVGs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PySide6",
    "Pillow",
    "numpy",
    "opencv-python-headless",
    "vtracer",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "pyinstaller",
]

[project.scripts]
tracer = "tracer.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
